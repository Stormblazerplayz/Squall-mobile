# XcodeGen spec. The Xcode project is generated from this file
# (run `xcodegen generate`), so BambuBay.xcodeproj is never committed.
name: BambuBay
options:
  bundleIdPrefix: com.stormblazerplayz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # The app's bundle id. The GitHub build can swap it with BAMBUBAY_BUNDLE_ID=...
    BAMBUBAY_BUNDLE_ID: com.stormblazerplayz.bambubay
targets:
  BambuBay:
    type: application
    platform: iOS
    sources:
      - path: BambuBay
    settings:
      base:
        PRODUCT_NAME: BambuBay
        PRODUCT_BUNDLE_IDENTIFIER: $(BAMBUBAY_BUNDLE_ID)
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - BambuBayTests
  # Unit tests for the printer protocol, 3MF reading, queue matching and detection voting.
  BambuBayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BambuBayTests
    dependencies:
      - target: BambuBay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BAMBUBAY_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/BambuBay.app/BambuBay
        BUNDLE_LOADER: $(TEST_HOST)
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
