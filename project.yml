# XcodeGen spec. The Xcode project is generated from this file
# (run `xcodegen generate`), so Squall.xcodeproj is never committed.
name: Squall
options:
  bundleIdPrefix: com.stormblazerplayz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # The app's bundle id. The Live Activities extension adds ".activities" to it.
    # The GitHub build can swap it with SQUALL_BUNDLE_ID=... (see .github/workflows/ios.yml).
    SQUALL_BUNDLE_ID: com.stormblazerplayz.squall
targets:
  Squall:
    type: application
    platform: iOS
    sources:
      - path: Squall
      # Live Activity models and their buttons, shared with the extension.
      - path: Shared
    dependencies:
      # Embedded in Squall.app/PlugIns so it ships with the app.
      - target: SquallActivities
    settings:
      base:
        PRODUCT_NAME: Squall
        PRODUCT_BUNDLE_IDENTIFIER: $(SQUALL_BUNDLE_ID)
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # The App Group and Keychain group shared with the widgets. The GitHub build adds them at signing time too.
        CODE_SIGN_ENTITLEMENTS: Config/Squall.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Extra icons you can pick in Settings > Look. Drawn by tools/render_icons.py.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "Classic StormCloud SquallSwirl BotCrew Orbit PowerChip"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - SquallTests
  # Live Activities on the Lock Screen and in the Dynamic Island, plus the team widget.
  SquallActivities:
    type: app-extension
    platform: iOS
    sources:
      - path: SquallActivities
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: SquallActivities
        PRODUCT_BUNDLE_IDENTIFIER: $(SQUALL_BUNDLE_ID).activities
        INFOPLIST_FILE: Config/ActivitiesInfo.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/SquallActivities.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  # Unit tests (Siri and Shortcuts), run on an iPhone simulator by the GitHub build.
  SquallTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SquallTests
    dependencies:
      - target: Squall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SQUALL_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Squall.app/Squall
        BUNDLE_LOADER: $(TEST_HOST)
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
