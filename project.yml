# XcodeGen spec. The Xcode project is generated from this file
# (run `xcodegen generate`), so Squall.xcodeproj is never committed.
name: Squall
options:
  bundleIdPrefix: com.stormblazerplayz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Squall:
    type: application
    platform: iOS
    sources:
      - path: Squall
    settings:
      base:
        PRODUCT_NAME: Squall
        PRODUCT_BUNDLE_IDENTIFIER: com.stormblazerplayz.squall
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    scheme: {}
