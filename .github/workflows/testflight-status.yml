name: TestFlight status

# Read-only check of what App Store Connect has for Squall: newest builds and their processing
# state, newest uploads with any problems Apple found, version trains and App Store versions.
# Runs on Linux in about a minute, so it never waits in line for a Mac.
# Start it from Actions > TestFlight status > Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.stormblazerplayz.squall' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install the App Store Connect API key
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::The App Store Connect secrets aren't set."
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY_PATH" 2>/dev/null || true
          fi
          chmod 600 "$KEY_PATH"
          grep -q "BEGIN PRIVATE KEY" "$KEY_PATH" || { echo "::error::APP_STORE_CONNECT_KEY_P8 doesn't look like a .p8 key."; exit 1; }
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Show what App Store Connect has
        run: python3 tools/testflight_status.py

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
