name: iOS build

# Every run (pull requests, pushes to main and "Run workflow"):
#   1. builds the app for real iPhones (this is also the "does the code compile" check)
#   2. saves an unsigned .ipa as a workflow artifact
# Only on pushes to main or "Run workflow", and only once the Apple secrets are added:
#   3. signs the build with your App Store Connect API key
#   4. saves the signed .ipa as an artifact and uploads it to TestFlight
# Without the secrets, steps 3 and 4 are skipped with a note, and the run still passes.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the build to TestFlight"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    name: Build app (and TestFlight when set up)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.stormblazerplayz.squall' }}
      BUILD_NUMBER: ${{ github.run_number }}
      EVENT_NAME: ${{ github.event_name }}
      UPLOAD_INPUT: ${{ inputs.upload }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check for Apple secrets
        id: signing
        run: |
          missing=""
          for pair in \
            "APP_STORE_CONNECT_KEY_ID=$ASC_KEY_ID" \
            "APP_STORE_CONNECT_ISSUER_ID=$ASC_ISSUER_ID" \
            "APP_STORE_CONNECT_KEY_P8=$ASC_KEY_P8" \
            "APPLE_TEAM_ID=$TEAM_ID"; do
            name="${pair%%=*}"
            value="${pair#*=}"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::notice title=TestFlight skipped::Apple secrets aren't set yet (missing:$missing). The app still builds and an unsigned .ipa is saved. See the README to set up TestFlight."
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "::notice title=TestFlight skipped::Pull requests only check the build. TestFlight runs on pushes to main or from Run workflow."
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "sign=true" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$UPLOAD_INPUT" != "true" ]; then
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pick the newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build the app
        run: |
          set -o pipefail
          # Built without signing. If the Apple secrets are set, the export step
          # below signs it with Apple's cloud-managed certificate using the API key,
          # so no certificate or provisioning profile is stored in this repo.
          xcodebuild archive \
            -project Squall.xcodeproj \
            -scheme Squall \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Squall.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            DEVELOPMENT_TEAM="${TEAM_ID:-}" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package an unsigned .ipa
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Squall.xcarchive/Products/Applications/Squall.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Squall.app wasn't found in the archive."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/unsigned/Payload"
          cp -R "$APP" "$RUNNER_TEMP/unsigned/Payload/"
          (cd "$RUNNER_TEMP/unsigned" && zip -qry "Squall-unsigned.ipa" Payload)
          ls -lh "$RUNNER_TEMP/unsigned/Squall-unsigned.ipa"

      - name: Save the unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Squall-unsigned-${{ github.run_number }}
          path: ${{ runner.temp }}/unsigned/Squall-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Install the App Store Connect API key
        if: steps.signing.outputs.sign == 'true'
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          else
            # Also accept the .p8 file pasted as base64.
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY_PATH" 2>/dev/null || true
          fi
          chmod 600 "$KEY_PATH"
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "::error::APP_STORE_CONNECT_KEY_P8 doesn't look like a .p8 key. Paste the whole file, including the BEGIN and END lines."
            exit 1
          fi
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Sign and export the .ipa
        if: steps.signing.outputs.sign == 'true'
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Squall.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          IPA_PATH=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No .ipa was exported."
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          echo "Exported $IPA_PATH (build $BUILD_NUMBER)"

      - name: Save the signed .ipa
        if: steps.signing.outputs.sign == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Squall-testflight-${{ github.run_number }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        if: steps.signing.outputs.upload == 'true'
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
          echo "::notice title=Uploaded::Build $BUILD_NUMBER is on its way to TestFlight. It shows up after Apple finishes processing it."

      - name: Remove the API key
        if: always()
        run: rm -rf "$HOME/.appstoreconnect/private_keys"
