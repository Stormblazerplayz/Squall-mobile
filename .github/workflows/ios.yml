name: iOS build

# Every run (pull requests, pushes to main and "Run workflow"):
#   1. builds the app for real iPhones and iPads (this is also the "does the code compile" check)
#   2. saves an unsigned .ipa as a workflow artifact
# Only on pushes to main or "Run workflow", and only once the Apple secrets are added:
#   3. signs the build with your App Store Connect API key
#   4. saves the signed .ipa as an artifact and uploads it to TestFlight
# Without the secrets, steps 3 and 4 are skipped with a note, and the run still passes.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the build to TestFlight"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event_name }}-${{ github.ref }}
  # Only pull request checks get cancelled by a newer push. TestFlight runs wait their turn,
  # so an upload is never cut off halfway and every build number is used once.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build app (and TestFlight when set up)
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write   # to tag each TestFlight build (testflight-<number>)
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.stormblazerplayz.squall' }}
      EVENT_NAME: ${{ github.event_name }}
      UPLOAD_INPUT: ${{ inputs.upload }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check for Apple secrets
        id: signing
        run: |
          missing=""
          for pair in \
            "APP_STORE_CONNECT_KEY_ID=$ASC_KEY_ID" \
            "APP_STORE_CONNECT_ISSUER_ID=$ASC_ISSUER_ID" \
            "APP_STORE_CONNECT_KEY_P8=$ASC_KEY_P8" \
            "APPLE_TEAM_ID=$TEAM_ID"; do
            name="${pair%%=*}"
            value="${pair#*=}"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::notice title=TestFlight skipped::Apple secrets aren't set yet (missing:$missing). The app still builds and an unsigned .ipa is saved. See the README to set up TestFlight."
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "secrets=true" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "::notice title=TestFlight skipped::Pull requests only check the build. TestFlight runs on pushes to main or from Run workflow."
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "sign=true" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$UPLOAD_INPUT" != "true" ]; then
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the App Store Connect API key
        if: steps.signing.outputs.secrets == 'true'
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          else
            # Also accept the .p8 file pasted as base64.
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY_PATH" 2>/dev/null || true
          fi
          chmod 600 "$KEY_PATH"
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "::error::APP_STORE_CONNECT_KEY_P8 doesn't look like a .p8 key. Paste the whole file, including the BEGIN and END lines."
            exit 1
          fi
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Pick the build number
        run: |
          # TestFlight builds count up by 1: the newest build on TestFlight, plus 1.
          # Test runs (pull requests) don't upload, so they don't use up a number.
          if [ "${{ steps.signing.outputs.upload }}" = "true" ]; then
            N=$(python3 tools/next_build_number.py)
            echo "::notice title=Build number::This TestFlight build is number $N."
          else
            N=1
            echo "Not a TestFlight upload, so the build number stays 1."
            if [ "${{ steps.signing.outputs.secrets }}" = "true" ]; then
              # Practice run, so a broken number lookup shows up here and not after merging.
              echo "The next TestFlight build would be number $(python3 tools/next_build_number.py)."
            fi
          fi
          echo "BUILD_NUMBER=$N" >> "$GITHUB_ENV"

      - name: Pick the newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build the app
        run: |
          set -o pipefail
          # Built without signing. If the Apple secrets are set, the export step
          # below signs it with Apple's cloud-managed certificate using the API key,
          # so no certificate or provisioning profile is stored in this repo.
          # SQUALL_BUNDLE_ID sets both bundle ids: the app gets $BUNDLE_ID and the
          # Live Activities extension gets $BUNDLE_ID.activities.
          xcodebuild archive \
            -project Squall.xcodeproj \
            -scheme Squall \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Squall.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            DEVELOPMENT_TEAM="${TEAM_ID:-}" \
            SQUALL_BUNDLE_ID="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO

      - name: Add the shared data entitlements to the app and its widgets
        # The archive is built without signing, so what the app and its Home Screen widgets
        # share is added here with a temporary ad-hoc signature. The export step below
        # re-signs everything with the real certificate and keeps it. Two ways to share:
        #  - the App Group group.$BUNDLE_ID (needs App Groups turned on at developer.apple.com)
        #  - the Keychain group $TEAM_ID.$BUNDLE_ID.shared (works with no setup)
        # Three sets are written, from most to least, so the export can fall back.
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Squall.xcarchive/Products/Applications/Squall.app"
          EXT="$APP/PlugIns/SquallActivities.appex"
          ENT_DIR="$RUNNER_TEMP/entitlements"
          rm -rf "$ENT_DIR" && mkdir -p "$ENT_DIR"
          GROUP_XML="<key>com.apple.security.application-groups</key><array><string>group.${BUNDLE_ID}</string></array>"
          APP_KEYCHAIN_XML=""
          EXT_KEYCHAIN_XML=""
          if [ -n "${TEAM_ID:-}" ]; then
            # The app's own group first, so its pairing token stays private to the app.
            APP_KEYCHAIN_XML="<key>keychain-access-groups</key><array><string>${TEAM_ID}.${BUNDLE_ID}</string><string>${TEAM_ID}.${BUNDLE_ID}.shared</string></array>"
            EXT_KEYCHAIN_XML="<key>keychain-access-groups</key><array><string>${TEAM_ID}.${BUNDLE_ID}.shared</string></array>"
          fi
          write_ent() {
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              "<plist version=\"1.0\"><dict>$2</dict></plist>" > "$ENT_DIR/$1"
            plutil -lint "$ENT_DIR/$1"
          }
          write_ent full-app.plist "${GROUP_XML}${APP_KEYCHAIN_XML}"
          write_ent full-ext.plist "${GROUP_XML}${EXT_KEYCHAIN_XML}"
          write_ent keychain-app.plist "${APP_KEYCHAIN_XML}"
          write_ent keychain-ext.plist "${EXT_KEYCHAIN_XML}"
          echo "ENT_DIR=$ENT_DIR" >> "$GITHUB_ENV"
          # Inside out: the extension first, then the app around it.
          codesign --force --sign - --timestamp=none --entitlements "$ENT_DIR/full-ext.plist" "$EXT"
          codesign --force --sign - --timestamp=none --entitlements "$ENT_DIR/full-app.plist" "$APP"
          APP_ENTS=$(codesign -d --entitlements - "$APP" 2>/dev/null || true)
          EXT_ENTS=$(codesign -d --entitlements - "$EXT" 2>/dev/null || true)
          grep -qF "group.${BUNDLE_ID}" <<<"$APP_ENTS" \
            || { echo "::error::The App Group didn't make it into Squall.app."; exit 1; }
          if [ -n "${TEAM_ID:-}" ]; then
            grep -qF "${BUNDLE_ID}.shared" <<<"$EXT_ENTS" \
              || { echo "::error::The shared Keychain group didn't make it into the widgets."; exit 1; }
            echo "App Group and shared Keychain group added to Squall.app and SquallActivities.appex."
          else
            echo "App Group added. No team id, so the shared Keychain group was skipped (this build isn't signed anyway)."
          fi

      - name: Package an unsigned .ipa
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Squall.xcarchive/Products/Applications/Squall.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Squall.app wasn't found in the archive."
            exit 1
          fi
          EXT="$APP/PlugIns/SquallActivities.appex"
          if [ ! -d "$EXT" ]; then
            echo "::error::The Live Activities extension (SquallActivities.appex) is missing from Squall.app."
            exit 1
          fi
          echo "App id: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          echo "Extension id: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXT/Info.plist")"
          mkdir -p "$RUNNER_TEMP/unsigned/Payload"
          cp -R "$APP" "$RUNNER_TEMP/unsigned/Payload/"
          (cd "$RUNNER_TEMP/unsigned" && zip -qry "Squall-unsigned.ipa" Payload)
          ls -lh "$RUNNER_TEMP/unsigned/Squall-unsigned.ipa"

      - name: Save the unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Squall-unsigned-${{ github.run_number }}
          path: ${{ runner.temp }}/unsigned/Squall-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Sign and export the .ipa
        if: steps.signing.outputs.sign == 'true'
        # Signs the app and its Live Activities extension. With -allowProvisioningUpdates
        # and the API key, Xcode registers the extension's App ID ($BUNDLE_ID.activities)
        # and makes App Store profiles for both, as long as the key has the Admin role.
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          export_ipa() {
            rm -rf "$RUNNER_TEMP/export"
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/Squall.xcarchive" \
              -exportPath "$RUNNER_TEMP/export" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$ASC_KEY_PATH" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          }
          resign() {
            APP="$RUNNER_TEMP/Squall.xcarchive/Products/Applications/Squall.app"
            if [ -n "${1:-}" ]; then
              codesign --force --sign - --timestamp=none --entitlements "$ENT_DIR/$1-ext.plist" "$APP/PlugIns/SquallActivities.appex"
              codesign --force --sign - --timestamp=none --entitlements "$ENT_DIR/$1-app.plist" "$APP"
            else
              codesign --force --sign - --timestamp=none "$APP/PlugIns/SquallActivities.appex"
              codesign --force --sign - --timestamp=none "$APP"
            fi
          }
          if export_ipa 2>&1 | tee "$RUNNER_TEMP/export.log"; then
            echo "Signed with the App Group and the shared Keychain group."
          else
            # Most likely the App ID doesn't have App Groups turned on. The widgets still get
            # their data through the shared Keychain group, which needs no setup.
            echo "::notice title=Signed without the App Group::App Groups aren't turned on for $BUNDLE_ID at developer.apple.com, so this build shares widget data through the Keychain instead. Nothing to fix."
            resign keychain
            if ! export_ipa 2>&1 | tee "$RUNNER_TEMP/export-keychain.log"; then
              echo "::warning title=Widgets can't get data::Signing with the shared Keychain group failed too, so this build was signed without it and the widgets will say Open Squall. See export-keychain.log above."
              resign
              export_ipa
            fi
          fi
          IPA_PATH=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No .ipa was exported. If the log says there's no profile for $BUNDLE_ID.activities, add that App ID at developer.apple.com (Identifiers) or give the API key the Admin role."
            exit 1
          fi
          # Make sure the Live Activities extension was signed too.
          CHECK_DIR="$RUNNER_TEMP/ipa-check"
          rm -rf "$CHECK_DIR" && mkdir -p "$CHECK_DIR"
          unzip -q "$IPA_PATH" -d "$CHECK_DIR"
          if ! codesign --verify --strict "$CHECK_DIR/Payload/Squall.app/PlugIns/SquallActivities.appex"; then
            echo "::error::The Live Activities extension in the .ipa isn't signed."
            exit 1
          fi
          # Say how the widgets will get their data in this build.
          SIGNED_EXT_ENTS=$(codesign -d --entitlements - "$CHECK_DIR/Payload/Squall.app/PlugIns/SquallActivities.appex" 2>/dev/null || true)
          SIGNED_APP_ENTS=$(codesign -d --entitlements - "$CHECK_DIR/Payload/Squall.app" 2>/dev/null || true)
          if grep -qF "${BUNDLE_ID}.shared" <<<"$SIGNED_EXT_ENTS" && grep -qF "${BUNDLE_ID}.shared" <<<"$SIGNED_APP_ENTS"; then
            echo "Widgets: shared Keychain group is in the signed app and widgets."
          else
            echo "::warning title=Widgets can't get data::The signed build doesn't have the shared Keychain group, so the widgets will say Open Squall."
          fi
          if grep -qF "group.${BUNDLE_ID}" <<<"$SIGNED_APP_ENTS"; then
            echo "Widgets: App Group is in the signed app too."
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          echo "Exported $IPA_PATH (build $BUILD_NUMBER)"

      - name: Save the signed .ipa
        if: steps.signing.outputs.sign == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Squall-testflight-${{ github.run_number }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        if: steps.signing.outputs.upload == 'true'
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
          echo "::notice title=Uploaded::Build $BUILD_NUMBER is on its way to TestFlight. It shows up after Apple finishes processing it."

      - name: Remember the build number
        if: steps.signing.outputs.upload == 'true'
        run: |
          # The next run starts from this tag, even before Apple lists the build.
          if git tag "testflight-$BUILD_NUMBER" "$GITHUB_SHA" && git push origin "refs/tags/testflight-$BUILD_NUMBER"; then
            echo "Tagged testflight-$BUILD_NUMBER"
          else
            echo "::warning title=Build number tag::Couldn't add the testflight-$BUILD_NUMBER tag. The next build still reads the number from App Store Connect."
          fi

      - name: Remove the API key
        if: always()
        run: rm -rf "$HOME/.appstoreconnect/private_keys"

  tests:
    name: Siri and app tests
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Pick the newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          DEST=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              version = [int(x) for x in runtime.split("iOS-")[-1].split("-") if x.isdigit()]
              for d in devices:
                  if d["name"].startswith("iPhone") and d.get("isAvailable", True):
                      key = (version, d["name"])
                      if best is None or key > best[0]:
                          best = (key, d["udid"])
          print(best[1] if best else "")
          ')
          if [ -z "$DEST" ]; then echo "::error::No iPhone simulator found"; exit 1; fi
          echo "Using simulator $DEST"
          echo "dest=$DEST" >> "$GITHUB_OUTPUT"

      - name: Run the tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Squall.xcodeproj \
            -scheme Squall \
            -destination "id=${{ steps.sim.outputs.dest }}" \
            -only-testing:SquallTests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Show the results
        if: always()
        run: |
          LOG="$RUNNER_TEMP/test.log"
          {
            echo "## Squall tests"
            if [ -f "$LOG" ]; then
              grep -E "Executed [0-9]+ tests|error:|failed \(" "$LOG" | tail -n 40 || echo "No results (the tests didn't run)"
            else
              echo "No results (the tests didn't run)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
