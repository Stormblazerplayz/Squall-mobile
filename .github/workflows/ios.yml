name: iOS build

# - Every pull request and push to main: a quick simulator build to check the code compiles.
# - Actions tab > "iOS build" > "Run workflow": builds a signed .ipa, saves it as a
#   workflow artifact and (by default) uploads it to TestFlight.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the build to TestFlight"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  check:
    name: Simulator build check
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Pick the newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Squall.xcodeproj \
            -scheme Squall \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

  testflight:
    name: Build .ipa and upload to TestFlight
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.stormblazerplayz.squall' }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Make sure the secrets are set
        run: |
          missing=0
          check() {
            if [ -z "$2" ]; then
              echo "::error::The GitHub secret $1 is missing. Add it in Settings > Secrets and variables > Actions."
              missing=1
            fi
          }
          check APP_STORE_CONNECT_KEY_ID "$ASC_KEY_ID"
          check APP_STORE_CONNECT_ISSUER_ID "$ASC_ISSUER_ID"
          check APP_STORE_CONNECT_KEY_P8 "$ASC_KEY_P8"
          check APPLE_TEAM_ID "$TEAM_ID"
          exit "$missing"

      - name: Pick the newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install the App Store Connect API key
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          else
            # Also accept the .p8 file pasted as base64.
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY_PATH" 2>/dev/null || true
          fi
          chmod 600 "$KEY_PATH"
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "::error::APP_STORE_CONNECT_KEY_P8 doesn't look like a .p8 key. Paste the whole file, including the BEGIN and END lines."
            exit 1
          fi
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build the archive
        run: |
          set -o pipefail
          # The archive is built unsigned. The export step below signs it with
          # Apple's cloud-managed distribution certificate using the API key,
          # so no certificate or provisioning profile has to be stored here.
          xcodebuild archive \
            -project Squall.xcodeproj \
            -scheme Squall \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Squall.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO

      - name: Sign and export the .ipa
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Squall.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          IPA_PATH=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No .ipa was exported."
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          echo "Exported $IPA_PATH (build $BUILD_NUMBER)"

      - name: Save the .ipa as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Squall-ios-build-${{ github.run_number }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        if: inputs.upload
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded build $BUILD_NUMBER. It shows up in TestFlight after Apple finishes processing it."

      - name: Remove the API key
        if: always()
        run: rm -rf "$HOME/.appstoreconnect/private_keys"
